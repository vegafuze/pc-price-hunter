name: Surveillance des prix

# Toutes les 30 minutes. GitHub ne lance les tâches planifiées que de façon très irrégulière
# (parfois 3 fois par jour) : chaque passage relance donc lui-même le suivant (étape « Relancer »).
# Le cron ci-dessous ne sert plus que de filet de secours si la chaîne s'interrompt.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Tout relire maintenant (ignore les intervalles)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Passage du moteur
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEEPA_TOPIC: ${{ secrets.KEEPA_TOPIC }}
          PPH_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python moteur/main.py

      - name: Enregistrer l'historique
        run: |
          git config user.name "pc-price-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ ETAT.md recap.png
          git commit -m "Relevé $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "Rien de nouveau"; exit 0; }
          git push || { git pull --rebase && git push; }

      - name: Relancer le prochain passage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # attend le prochain créneau (minute 11 ou 41), puis relance ce même workflow,
          # sauf si un autre passage est déjà en attente ou en cours (une seule chaîne à la fois)
          now=$(date -u +%s); m=$(date -u +%-M); s=$(date -u +%-S)
          if [ "$m" -lt 11 ]; then w=$(( (11-m)*60 - s )); elif [ "$m" -lt 41 ]; then w=$(( (41-m)*60 - s )); else w=$(( (71-m)*60 - s )); fi
          echo "Attente de $w s"; sleep "$w"
          autres=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow surveillance.yml --limit 20 \
                     --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status != \"completed\")] | length")
          if [ "$autres" = "0" ]; then
            gh workflow run surveillance.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Prochain passage lancé"
          else
            echo "Un autre passage est déjà prévu ($autres) : pas de relance"
          fi
